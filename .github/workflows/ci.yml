name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff
      - name: Lint (ruff)
        run: ruff check james tests
      - name: Compile all modules
        run: python -m compileall -q james
      - name: Config check
        run: python -m james --check
      - name: Tool registry smoke test
        run: python -c "import james.tools.registry as r; reg=r.ToolRegistry(); assert 'write_file' in reg.names(); print('tools:', len(reg.names()))"
      - name: Run tests
        run: python -m pytest -q
