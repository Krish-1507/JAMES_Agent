name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          # docs extra + python-multipart: the document/office/gateway tests
          # exercise the file-based document tools and form parsing.
          pip install -e ".[docs]"
          pip install "python-multipart>=0.0.9"
          pip install pytest pytest-cov pytest-timeout "ruff==0.16.2"
      - name: Lint (ruff)
        run: ruff check james tests
      - name: Compile all modules
        run: python -m compileall -q james
      - name: Config check
        run: python -m james --check
      - name: Tool registry smoke test
        run: python -c "import james.tools.registry as r; reg=r.ToolRegistry(); assert 'write_file' in reg.names(); print('tools:', len(reg.names()))"
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        # --timeout guards against a stray hang blocking the whole matrix;
        # it also tells us exactly which test is stuck.
        run: python -m pytest -q --timeout=240
      - name: Run tests (main suite, ubuntu)
        if: matrix.os == 'ubuntu-latest'
        # The last two files run in a fresh interpreter: a long-lived suite
        # process on the ubuntu runner degrades (allocation/thread failures)
        # once ~90% of the suite has executed, so the tail files get their
        # own process.
        run: python -m pytest -q --timeout=240 --ignore=tests/test_phase5_server_ui.py --ignore=tests/test_security_guard_isolation.py
      - name: Run tests (tail files, ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: python -m pytest -q --timeout=240 tests/test_phase5_server_ui.py tests/test_security_guard_isolation.py

  coverage:
    name: Coverage gate (security-critical modules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
          pip install "python-multipart>=0.0.9"
          pip install pytest pytest-cov pytest-timeout "ruff==0.16.2"
      - name: Run security-module coverage gate
        run: python scripts/coverage_gate.py