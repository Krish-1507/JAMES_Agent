name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff
      - name: Lint (ruff)
        run: ruff --version && ruff check james || true
      - name: Compile all modules
        run: python -m compileall james
      - name: Config check
        run: python -m james --check
      - name: Smoke test (no API key, local agent)
        run: python -c "import james.tools.registry as r; reg=r.ToolRegistry(); assert 'write_file' in reg.names(); print('tools:', len(reg.names()))"
