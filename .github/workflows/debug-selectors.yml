name: Debug-selectors-3.12
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  alone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[docs]"
          pip install pytest pytest-timeout "python-multipart>=0.0.9"
      - name: server_ui alone
        timeout-minutes: 4
        run: python -m pytest tests/test_phase5_server_ui.py -v --timeout=60 -x
        continue-on-error: true
  preceded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[docs]"
          pip install pytest pytest-timeout "python-multipart>=0.0.9"
      - name: with phase3-ish files before
        timeout-minutes: 6
        run: |
          python -m pytest tests/test_phase3_providers_voice.py tests/test_phase4_recipes.py -v --timeout=60 -x
          python -m pytest tests/test_phase5_server_ui.py -v --timeout=60 -x
        continue-on-error: true