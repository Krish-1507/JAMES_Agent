name: Debug-selectors-3.12
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[docs]"
          pip install pytest pytest-timeout pytest-xdist "python-multipart>=0.0.9"
      - name: Full suite x4
        timeout-minutes: 10
        run: PYTHONPATH=. python -m pytest -q --timeout=120 -n 4 -p debug_diag
      - name: Diagnostics
        if: always()
        run: |
          echo "== cgroup =="; cat /sys/fs/cgroup/memory.max 2>/dev/null; cat /sys/fs/cgroup/memory.current 2>/dev/null; cat /sys/fs/cgroup/memory.high 2>/dev/null
          echo "== overcommit =="; cat /proc/sys/vm/overcommit_memory
          echo "== max_map_count =="; cat /proc/sys/vm/max_map_count
          echo "== ulimit =="; ulimit -a
          echo "== free =="; free -m
          echo "== diag log =="; cat /tmp/diag.log 2>/dev/null || echo "(no diag log)"