name: Debug-selectors-3.12
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[docs]"
          pip install pytest pytest-timeout pytest-xdist "python-multipart>=0.0.9"
      - name: Full suite x2
        timeout-minutes: 10
        run: python -m pytest -q --timeout=120 -n 2