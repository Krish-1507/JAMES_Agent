name: Debug-selectors-3.12
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[docs]"
          pip install pytest pytest-timeout "python-multipart>=0.0.9"
      - name: Main suite (all but tail files)
        timeout-minutes: 12
        run: python -m pytest tests -q --timeout=120 --ignore=tests/test_phase5_server_ui.py --ignore=tests/test_security_guard_isolation.py
      - name: Tail files in a fresh process
        timeout-minutes: 5
        run: python -m pytest tests/test_phase5_server_ui.py tests/test_security_guard_isolation.py -q --timeout=120