name: Debug-selectors-3.12
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  bisect:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py: ["3.12", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install
        run: |
          python -m pip install -e ".[docs]"
          pip install pytest pytest-timeout "python-multipart>=0.0.9"
      - name: Suspect A (cov_gaps mcp + dashboard)
        timeout-minutes: 4
        run: |
          python -m pytest tests/test_phase5_release_cov_gaps.py tests/test_phase5_release_dashboard.py -v --timeout=90 -x
        continue-on-error: true
      - name: Suspect B (docs_voice + security_cov)
        timeout-minutes: 4
        run: |
          python -m pytest tests/test_phase5_release_docs_voice.py tests/test_phase5_release_security_cov.py -v --timeout=90 -x
        continue-on-error: true
      - name: Suspect C (cli + browser)
        timeout-minutes: 4
        run: |
          python -m pytest tests/test_phase5_release_cli.py tests/test_phase5_release_browser.py -v --timeout=90 -x
        continue-on-error: true