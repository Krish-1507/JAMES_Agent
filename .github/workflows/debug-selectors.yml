name: Debug-selectors-3.12
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install
        run: |
          python -m pip install -e ".[docs]"
          pip install pytest pytest-timeout "python-multipart>=0.0.9"
      - name: Full suite verbose, stop at first timeout
        timeout-minutes: 12
        run: |
          python -m pytest -v --timeout=120 -x
        continue-on-error: true