name: Debug-selectors-3.12
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  j1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[docs]"
          pip install pytest pytest-timeout "python-multipart>=0.0.9"
      - name: J1 early phases
        timeout-minutes: 6
        run: python -m pytest tests/test_phase0_regressions.py tests/test_phase1_agent_quality.py tests/test_phase1_features.py tests/test_phase2_learning_loop.py tests/test_phase5_server_ui.py -v --timeout=60 -x
        continue-on-error: true
  j2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[docs]"
          pip install pytest pytest-timeout "python-multipart>=0.0.9"
      - name: J2 providers/sdk/voice/gateway
        timeout-minutes: 6
        run: python -m pytest tests/test_phase3_providers_voice.py tests/test_phase3_sdk.py tests/test_phase4_duplex_voice.py tests/test_phase4_gateway.py tests/test_phase5_server_ui.py -v --timeout=60 -x
        continue-on-error: true
  j3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[docs]"
          pip install pytest pytest-timeout "python-multipart>=0.0.9"
      - name: J3 integrations/office/recipes
        timeout-minutes: 6
        run: python -m pytest tests/test_phase4_integrations.py tests/test_phase4_office_marketplace.py tests/test_phase4_recipes.py tests/test_phase5_server_ui.py -v --timeout=60 -x
        continue-on-error: true
  j4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[docs]"
          pip install pytest pytest-timeout "python-multipart>=0.0.9"
      - name: J4 release files
        timeout-minutes: 6
        run: python -m pytest tests/test_phase5_release_browser.py tests/test_phase5_release_cli.py tests/test_phase5_release_cov_gaps.py tests/test_phase5_release_dashboard.py tests/test_phase5_release_docs_voice.py tests/test_phase5_release_security_cov.py tests/test_phase5_server_ui.py -v --timeout=60 -x
        continue-on-error: true