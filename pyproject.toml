[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "james-assistant"
version = "0.4.0"
description = "JAMES is an alpha-stage, desktop-first LLM assistant with explicit safety boundaries."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JAMES Contributors" }]
keywords = ["assistant", "voice", "agent", "llm", "automation", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies are enough to run JAMES in text mode with any LLM provider.
# Everything else is an optional extra so the base install stays light.
dependencies = [
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
# Orb GUI (live task canvas)
ui = ["PyQt5>=5.15.0"]
# Model Context Protocol - inherit thousands of community servers
mcp = ["mcp>=1.2.0"]
# Document generation and reading
docs = [
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "reportlab>=4.1.0",
    "fpdf2>=2.7.9",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
    "odfpy>=1.4.0",
    "pyarrow>=14.0.0",
]
# Browser automation (Playwright)
browser = ["playwright>=1.43.0"]
# Desktop control (computer-use)
desktop = ["pyautogui>=0.9.54", "Pillow>=10.0.0", "pyperclip>=1.8.2", "psutil>=5.9.8", "plyer>=2.1.0"]
# Voice (STT + TTS)
voice = [
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "PyAudio>=0.2.13",
    "openai-whisper>=20231117",
    "edge-tts>=6.1.0",
    "faster-whisper>=1.0.0",
    "webrtcvad>=0.0.11",
]
# Long-term semantic memory (RAG)
memory = ["sentence-transformers>=2.2.0", "numpy>=1.24.0"]
# Development / contributor tooling
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "pre-commit>=3.5.0",
]
# Everything optional
all = [
    "PyQt5>=5.15.0",
    "mcp>=1.2.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "reportlab>=4.1.0",
    "fpdf2>=2.7.9",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
    "odfpy>=1.4.0",
    "pyarrow>=14.0.0",
    "playwright>=1.43.0",
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
    "pyperclip>=1.8.2",
    "psutil>=5.9.8",
    "plyer>=2.1.0",
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "PyAudio>=0.2.13",
    "openai-whisper>=20231117",
    "edge-tts>=6.1.0",
    "faster-whisper>=1.0.0",
    "webrtcvad>=0.0.11",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/Krish-1507/JAMES_Agent"
Repository = "https://github.com/Krish-1507/JAMES_Agent"
Issues = "https://github.com/Krish-1507/JAMES_Agent/issues"

[project.scripts]
james = "james.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["james*"]
